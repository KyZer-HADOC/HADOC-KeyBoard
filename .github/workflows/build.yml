name: Build setup.exe

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish app (self-contained, single file)
        run: >
          dotnet publish HadocKeyboard/HadocKeyboard.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o publish

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\setup.iss'

      - name: Create installer checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist/HADOC-KeyBoard-Setup.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  HADOC-KeyBoard-Setup.exe" | Set-Content "dist/SHA256SUMS.txt" -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: HADOC-KeyBoard-Setup
          path: |
            dist/HADOC-KeyBoard-Setup.exe
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/HADOC-KeyBoard-Setup.exe
            dist/SHA256SUMS.txt

      - name: Publish stable release from main
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          target_commitish: main
          name: HADOC KeyBoard v1.0.1
          files: |
            dist/HADOC-KeyBoard-Setup.exe
            dist/SHA256SUMS.txt
